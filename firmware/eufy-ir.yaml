# Reference copy - the live version is in the private homelab ESPHome config repo
# (where `!include common/...` resolves). IR codes are the published RoboVac 11S
# set, which Eufy's own remote listing confirms are shared with the 12.
substitutions:
  devicename: eufy-ir

esp32:
  board: esp32dev

esphome:
  name: $devicename

<<: !include common/base.yaml
<<: !include common/sensor.yaml

# IR bridge for the Eufy RoboVac 12 (rover project, issue #1 / roadmap 2E).
# Wiring on a generic ESP32 devkit:
#   IR receiver module (VS1838B-type): VCC->3V3, GND->GND, OUT->GPIO14
#   IR LED (940nm): GPIO4 -> 100R -> LED anode, cathode -> GND (direct drive
#   is fine at lid distance; add a 2N2222 stage for room-range)
# The codes below are the published RoboVac 11S remote codes (Pronto). If the
# 12 ignores a button, press the real remote at the receiver and read the
# dumped code from the log, then replace it here.
remote_receiver:
  pin:
    number: GPIO14
    inverted: true
  dump: pronto

remote_transmitter:
  pin:
    number: GPIO4
  carrier_duty_percent: 50%

button:
  - platform: template
    name: "Eufy Forward"
    on_press:
      - remote_transmitter.transmit_pronto:
          data: "0000 006D 0032 0000 0073 0074 0012 0015 0012 003B 0012 003B 0012 0014 0012 003B 0012 0013 0013 0015 0012 0015 0012 0015 0012 0015 0012 0039 0013 0015 0012 0039 0013 0039 0013 0013 0013 0013 0013 0015 0012 0015 0012 0015 0012 003B 0012 0014 0012 003B 0012 003B 0012 0015 0012 0015 0012 0015 0011 0015 0011 0015 0012 003B 0012 0039 0013 0013 0013 003B 0012 0014 0012 0014 0012 003B 0012 003B 0012 003A 0012 0015 0012 003B 0012 0013 0013 003B 0012 003B 0012 003B 0012 003B 0012 0015 0012 0015 0012 0015 0012 003B 0012 0181"
          repeat:
            times: 1
            wait_time: 10ms
