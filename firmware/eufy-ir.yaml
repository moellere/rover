# Reference copy - the live version is in the private homelab ESPHome config repo
# (where `!include common/...` resolves).
substitutions:
  devicename: eufy-ir

esp32:
  board: esp32dev

esphome:
  name: $devicename

<<: !include common/base.yaml
<<: !include common/sensor.yaml

# IR bridge for the Eufy RoboVac 12 (rover project, issue #1 / roadmap 2E).
# Wiring on a generic ESP32 devkit:
#   IR receiver module (VS1838B-type): VCC->3V3, GND->GND, OUT->GPIO14
#   IR LED (940nm): GPIO4 -> 100R -> LED anode, cathode -> GND (direct drive
#   is fine at lid distance; add a 2N2222 stage for room-range)
# Codes: captured 2026-09-28 from this RoboVac 12's own remote via the receiver
# below (same protocol family as the published 11S codes - identical framing
# and address prefix - but different command payloads, so the 11S set did NOT
# work). To add a button: press it at the receiver, copy the dumped Pronto.
remote_receiver:
  pin:
    number: GPIO14
    inverted: true
  dump: pronto

remote_transmitter:
  pin:
    number: GPIO4
  carrier_duty_percent: 50%

button:
  - platform: template
    name: "Eufy Forward"
    on_press:
      - remote_transmitter.transmit_pronto:
          data: "0000 006D 0032 0000 0073 0072 0013 0013 0015 0037 0015 0037 0015 0011 0015 0037 0015 0011 0015 0011 0015 0011 0015 0011 0015 0011 0015 0038 0014 0011 0015 0037 0015 0037 0015 0011 0015 0011 0015 0011 0015 0011 0015 0011 0015 0011 0015 0011 0015 0011 0015 0011 0015 0011 0015 0011 0015 0011 0015 0011 0015 0038 0014 0011 0015 0011 0015 0037 0015 0037 0015 0037 0015 0037 0015 0037 0015 0037 0015 0037 0015 0037 0015 0037 0015 0037 0015 0037 0015 0011 0015 0037 0015 0011 0015 0011 0015 0037 0015 0037 0015 0011 0015 0181"
          repeat:
            times: 1
            wait_time: 10ms
