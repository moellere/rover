# Reference copy - the canonical, live-flashed version of this file lives in a
# private homelab ESPHome config repo (which is where `!include common/...` and
# `!secret api_key` actually resolve from). This copy won't compile standalone;
# it's here for history/documentation of the rover project.
# Grover's spinal cord on an ESP32 devkit (port of rover.yaml, 2026-10-03).
# Why: the TFMini shares the ESP8266's only I2C bus with the MCP23008; a stuck
# TFMini froze the motor direction pins and cliff inputs until a power cycle.
# The ESP32 has pins to spare: no expander at all, TFMini alone on I2C.
#
# Pin map (ESP32 devkit, "esp32dev"):
#   GPIO25 SDA / GPIO26 SCL  bus_b: TFMini (0x10) - the only I2C device
#   GPIO17  left EN (PWM)    GPIO16  right EN (PWM)        -> L298N ENB/ENA
#   GPIO22/23  left fwd/rev   GPIO19/18  right fwd/rev     -> L298N direction
#   GPIO35 / GPIO32  front-left / front-right cliff (35 is input-only)
#   GPIO33 / GPIO13  reserved: rear cliff sensors
#   GPIO34  battery divider (ADC1, input-only; no onboard divider on this
#           board, so the external 100k/27k alone: ~4.7x, calibrate)
#   Avoid 0/2/12/15 (strapping), 6-11 (flash). 34-39 are input-only.
substitutions:
  devicename: rover32

esp32:
  board: esp32dev
  framework:
    type: esp-idf

esphome:
  name: $devicename
  on_boot:
      - output.set_level:
          id: left_pwm
          level: 0%
      - output.set_level:
          id: right_pwm
          level: 0%
      - output.turn_off: left_forward_pin
      - output.turn_off: right_forward_pin
      - output.turn_off: left_reverse_pin
      - output.turn_off: right_reverse_pin

<<: !include common/base.yaml
<<: !include common/sensor.yaml


time:
  - platform: homeassistant
    id: homeassistant_time

globals:
  - id: last_command_ms
    type: uint32_t
    restore_value: no
    initial_value: '0'
  - id: cliff_detected
    type: bool
    restore_value: no
    initial_value: 'false'
  - id: battery_ok
    type: bool
    restore_value: no
    initial_value: 'true'
  # TFMini forward LiDAR: true while something is inside the "Obstacle stop"
  # distance. Holds its last state through invalid frames, because the
  # TFMini goes invalid under 30 cm - an object that crossed the threshold
  # and kept coming must not clear the guard by getting too close to see.
  - id: obstacle_ahead
    type: bool
    restore_value: no
    initial_value: 'false'
  - id: tfmini_errors
    type: int
    restore_value: no
    initial_value: '0'
  - id: last_good_cm
    type: float
    restore_value: no
    initial_value: '1000'

# Pin map for awning
#MCP0: Connected to L298N IN1
#MCP1: Connected to L298N IN2 
#MCP2: Connected to L298N IN3
#MCP3: Connected to L298N IN4
#MCP4:
#MCP5: 
#MCP6: 
#MCP7: 



# Stop = brief dynamic brake, then coast. Both inputs of each L298N bridge
# high with EN high shorts the motor winding; ~150 ms is enough to kill the
# momentum at cruise (coast alone was ~8 cm). Then everything releases so
# nothing sits in a braked short. Every stop path uses this - watchdog,
# disconnect, cliff, battery, the stop action. The "Brake on stop" switch
# gates the brake phase; it boots OFF (a 2026-09-29 A/B showed no measurable
# effect on short pulses, and the ESP8266 doesn't persist switch state
# across power cycles anyway). The stop itself always happens.
# Pins go to brake before EN goes to 100%, so there is never a full-duty
# instant in the old drive direction.
script:
  - id: motor_stop
    mode: restart
    then:
      - if:
          condition:
            switch.is_on: brake_on_stop
          then:
            - output.turn_on: left_forward_pin
            - output.turn_on: left_reverse_pin
            - output.turn_on: right_forward_pin
            - output.turn_on: right_reverse_pin
            - output.set_level:
                id: left_pwm
                level: 100%
            - output.set_level:
                id: right_pwm
                level: 100%
            - delay: 150ms
      - output.set_level:
          id: left_pwm
          level: 0%
      - output.set_level:
          id: right_pwm
          level: 0%
      - output.turn_off: left_forward_pin
      - output.turn_off: right_forward_pin
      - output.turn_off: left_reverse_pin
      - output.turn_off: right_reverse_pin
      - text_sensor.template.publish:
          id: motion_status
          state: "Stopped"

interval:
  # TFMini (SparkFun Qwiic, I2C 0x10, shares the bus with the MCP23008):
  # write 01 02 07, read 7 bytes [valid, -, dist cm LE, strength LE, mode].
  # With the guard enabled, a missing sensor (5 failed reads) counts as an
  # obstacle - fail safe, forward refused - rather than as a clear lane.
  - interval: 100ms
    then:
      - lambda: |-
          const uint8_t cmd[3] = {0x01, 0x02, 0x07};
          uint8_t buf[7] = {0};
          const float thr = id(obstacle_stop_cm).state;
          // SparkFun's sequence: command, then read with a repeated start (no
          // stop in between). A plain write-then-read was NACKed every time
          // and left the sensor holding SCL low (2026-10-03).
          auto ew = id(bus_b).write_readv(0x10, cmd, 3, buf, 7);
          ESP_LOGVV("tfmini", "wr=%d raw=%02X %02X %02X %02X %02X %02X %02X", (int) ew,
                    buf[0], buf[1], buf[2], buf[3], buf[4], buf[5], buf[6]);
          if (ew != i2c::ERROR_OK) {
            if (++id(tfmini_errors) == 5) {
              ESP_LOGW("tfmini", "no response at 0x10");
              id(front_range).publish_state(NAN);
            }
            if (id(tfmini_errors) >= 5) id(obstacle_ahead) = thr > 0;
            return;
          }
          id(tfmini_errors) = 0;
          const float cm = buf[2] | (uint16_t(buf[3]) << 8);
          if (buf[0] != 0x01 || cm >= 65535) {  // 0xFFFF = no return
            id(front_range_valid).publish_state(false);
            // Invalid usually means "too close" (<30 cm) or "nothing out
            // there". If the last good reading was already close, assume
            // the former: a wall met at an angle went from "far" to
            // invalid without tripping the guard (2026-10-04, dining room).
            if (thr > 0 && id(last_good_cm) < 60) id(obstacle_ahead) = true;
            return;
          }
          const float strength = buf[4] | (uint16_t(buf[5]) << 8);
          id(front_range_valid).publish_state(true);
          id(front_range).publish_state(cm);
          id(last_good_cm) = cm;
          id(front_range_strength).publish_state(strength);
          id(obstacle_ahead) = thr > 0 && cm < thr;
      - if:
          condition:
            lambda: 'return id(obstacle_ahead) && id(motion_status).state == "Forward";'
          then:
            - script.execute: motor_stop
            - text_sensor.template.publish:
                id: motion_status
                state: "Stopped (obstacle)"
            - logger.log: "Obstacle ahead inside the stop distance, stopping"
  - interval: 200ms
    then:
      - if:
          condition:
            lambda: |-
              return (id(motion_status).state != "Stopped") && (millis() - id(last_command_ms) > 1500);
          then:
            - script.execute: motor_stop
            - text_sensor.template.publish:
                id: motion_status
                state: "Stopped"
            - logger.log: "Watchdog: no command refresh in 1.5s, stopping motors"

i2c:
  # Only the TFMini lives on I2C now (the MCP23008 is gone - direction and
  # cliff pins are direct on the ESP32), so a wedged sensor costs nothing
  # but the range reading. Repeated-start reads, 100 kHz, generous timeout
  # (it stretches the clock while it prepares a reply).
  - id: bus_b
    sda: GPIO25
    scl: GPIO26
    scan: true
    frequency: 100kHz
    timeout: 20ms

# Example configuration entry
output:
  # Trike build (2026-09-29): the motors sit on the opposite sides, facing the
  # opposite way, compared with the tank build. Electrically that is a swap of
  # channels AND polarity, so the "left" outputs below drive L298N channel B
  # in what the board calls reverse, and vice versa. Pivots were already
  # correct on the trike; forward/backward were inverted - this fixes that.
  # As wired 2026-10-03 (bench-verified): the motor on GPIO17 (EN) with
  # GPIO22 forward / GPIO23 reverse is the LEFT one; GPIO16 with GPIO19
  # forward / GPIO18 reverse is the RIGHT. Fixed here, not in the wires.
  - platform: ledc
    pin: GPIO17
    frequency: 1000 Hz
    id: left_pwm
  - platform: ledc
    pin: GPIO16
    frequency: 1000 Hz
    id: right_pwm
  - platform: gpio
    id: left_forward_pin
    pin: GPIO22
  - platform: gpio
    id: left_reverse_pin
    pin: GPIO23
  - platform: gpio
    id: right_forward_pin
    pin: GPIO19
  - platform: gpio
    id: right_reverse_pin
    pin: GPIO18

# Downward-facing IR reflectance ("cliff") sensors on the free MCP23008 pins.
# Wiring: VCC/GND + digital OUT of each IR module -> MCP4 (front-left), MCP5 (front-right).
# `inverted: false` assumes the module drives OUT low when it sees a close reflective
# surface (floor/bench) and high when there's nothing to reflect off (edge/drop-off) -
# verify against the actual module datasheet once wired and flip `inverted` if backwards.
binary_sensor:
  - platform: template
    name: "Front range valid"
    id: front_range_valid
    filters:
      # at 10 Hz the odd read comes back not-ready even on a steady target
      - delayed_off: 400ms
  - platform: gpio
    name: "Front Left Cliff"
    id: front_left_cliff
    device_class: safety
    pin:
      number: GPIO35   # input-only; the sensor module drives it (no pull-up on 34-39)
      inverted: false
    filters:
      - delayed_on_off: 50ms
    on_press:
      - lambda: |-
          id(cliff_detected) = true;
      - script.execute: motor_stop
      - text_sensor.template.publish:
          id: motion_status
          state: "Stopped (cliff)"
      - logger.log: "Cliff detected (front-left), emergency stop"
    on_release:
      - lambda: |-
          id(cliff_detected) = id(front_left_cliff).state || id(front_right_cliff).state;
  - platform: gpio
    name: "Front Right Cliff"
    id: front_right_cliff
    device_class: safety
    pin:
      number: GPIO32
      inverted: false
    filters:
      - delayed_on_off: 50ms
    on_press:
      - lambda: |-
          id(cliff_detected) = true;
      - script.execute: motor_stop
      - text_sensor.template.publish:
          id: motion_status
          state: "Stopped (cliff)"
      - logger.log: "Cliff detected (front-right), emergency stop"
    on_release:
      - lambda: |-
          id(cliff_detected) = id(front_left_cliff).state || id(front_right_cliff).state;

# Battery voltage: 3S 18650 pack (~12.6V full, ~9.0V empty) through an external divider
# into A0. A0 on the D1 mini already has an onboard divider extending it to ~0-3.2V;
# add your OWN divider from pack+ -> A0 -> GND with R_top=100k, R_bottom=27k (scales
# 12.6V down to ~2.7V, safely under the board's ~3.2V max). The `multiply: 15.0` below
# is a starting estimate for the combined ratio of both dividers - calibrate it against
# a multimeter reading once wired (adjust the constant so the reported voltage matches).
sensor:
  # NOTE: this file's top-level `sensor:` replaces (not merges with) the one pulled in
  # via `<<: !include common/sensor.yaml` above (that's a raw YAML merge-key, not
  # ESPHome `packages:`, so same-key blocks don't combine) - the uptime/wifi_signal
  # entries are duplicated here so they aren't lost.
  - platform: uptime
    name: ${devicename} Uptime
  - platform: wifi_signal
    name: ${devicename} WiFi Signal
    update_interval: 60s
  - platform: template
    name: "Front range"
    id: front_range
    unit_of_measurement: "cm"
    device_class: distance
    state_class: measurement
    accuracy_decimals: 0
    filters:
      - or:
          - delta: 2
          - throttle: 10s
  - platform: template
    name: "Front range strength"
    id: front_range_strength
    state_class: measurement
    accuracy_decimals: 0
    filters:
      - throttle_average: 5s
  - platform: adc
    pin: GPIO34
    attenuation: 12db
    name: "Battery Voltage"
    id: battery_voltage
    update_interval: 30s
    filters:
      # External divider only (100k top / 27k bottom): nominal 4.704.
      # Calibrated 2026-10-03: 4.704 reported 12.002 V with the meter at
      # 11.90 V across the pack -> 4.704 * 11.90 / 12.002 = 4.664.
      - multiply: 4.664
      - sliding_window_moving_average:
          window_size: 5
          send_every: 5
    on_value_range:
      - below: 9.3
        then:
          - lambda: |-
              id(battery_ok) = false;
          - script.execute: motor_stop
          - text_sensor.template.publish:
              id: motion_status
              state: "Stopped (low battery)"
          - logger.log: "Battery critical, disabling drive"
      - above: 9.6
        then:
          - lambda: |-
              id(battery_ok) = true;

# Motor duty, adjustable live over the API so the brain can tune without a
# reflash. The trike pivots ~30 deg per 0.1 s at 100%; 50% is the starting
# point. Values survive reboots.
number:
  # 0 = guard off. Boots at 35 cm (verified 2026-10-03: forward refused and
  # a forward move cut once the range dropped under it). The TFMini goes
  # invalid under 30 cm, so 35 is about as close as the guard can act; the
  # brain lowers it for the last part of a homing/docking approach.
  - platform: template
    name: "Obstacle stop"
    id: obstacle_stop_cm
    unit_of_measurement: "cm"
    min_value: 0
    max_value: 200
    step: 5
    initial_value: 35
    optimistic: true
    entity_category: config
  # Per-side balance for straight driving: scales the LEFT motor's duty on
  # forward/backward (pivots untouched). + = more left. Calibrated
  # 2026-10-03 on the bench with fishcam: 0 -> ~7 deg/pulse left,
  # +10 -> ~5 deg/pulse right, +6 -> straight over 3 pulses.
  - platform: template
    name: "Left trim"
    id: left_trim
    unit_of_measurement: "%"
    min_value: -30
    max_value: 30
    step: 1
    initial_value: 6
    optimistic: true
    entity_category: config
  - platform: template
    name: "Drive duty"
    id: drive_duty
    unit_of_measurement: "%"
    min_value: 20
    max_value: 100
    step: 5
    initial_value: 75
    restore_value: true
    optimistic: true
  - platform: template
    name: "Pivot duty"
    id: pivot_duty
    unit_of_measurement: "%"
    min_value: 20
    max_value: 100
    step: 5
    initial_value: 50
    restore_value: true
    optimistic: true

switch:
  - platform: template
    name: "Brake on stop"
    id: brake_on_stop
    optimistic: true
    restore_mode: ALWAYS_OFF
    entity_category: config
  - platform: template
    name: "Forward"
    lambda: |-
      if (id(motion_status).state == "Forward") {
        return true;
      } else {
        return false;
      }
    turn_on_action:
      - lambda: |-
          id(last_command_ms) = millis();
      - if:
          condition:
            lambda: 'return id(battery_ok) && !id(cliff_detected) && !id(obstacle_ahead);'
          then:
            - output.set_level:
                id: left_pwm
                level: !lambda 'return std::min(1.0f, id(drive_duty).state / 100.0f * (1.0f + id(left_trim).state / 100.0f));'
            - output.set_level:
                id: right_pwm
                level: !lambda 'return id(drive_duty).state / 100.0;'
            - output.turn_on: left_forward_pin
            - output.turn_on: right_forward_pin
            - output.turn_off: left_reverse_pin
            - output.turn_off: right_reverse_pin
            - text_sensor.template.publish:
                id: motion_status
                state: "Forward"
    turn_off_action:
      - script.execute: motor_stop
      - text_sensor.template.publish:
          id: motion_status
          state: "Stopped"

text_sensor:
  - platform: template
    name: "Motion"
    id: motion_status

api:
  on_client_disconnected:
    - script.execute: motor_stop
    - text_sensor.template.publish:
        id: motion_status
        state: "Stopped"
    - logger.log: "API client disconnected, stopping motors"
  actions:
    - action: forward
      then:
      - script.stop: motor_stop
      - lambda: |-
          id(last_command_ms) = millis();
      - if:
          condition:
            lambda: 'return id(battery_ok) && !id(cliff_detected) && !id(obstacle_ahead);'
          then:
            - output.set_level:
                id: left_pwm
                level: !lambda 'return std::min(1.0f, id(drive_duty).state / 100.0f * (1.0f + id(left_trim).state / 100.0f));'
            - output.set_level:
                id: right_pwm
                level: !lambda 'return id(drive_duty).state / 100.0;'
            - output.turn_on: left_forward_pin
            - output.turn_on: right_forward_pin
            - output.turn_off: left_reverse_pin
            - output.turn_off: right_reverse_pin
            - text_sensor.template.publish:
                id: motion_status
                state: "Forward"
          else:
            - script.execute: motor_stop
            - text_sensor.template.publish:
                id: motion_status
                state: "Stopped"
            - logger.log: "Forward blocked (cliff, obstacle or low battery)"
    - action: backward
      then:
      - script.stop: motor_stop
      - lambda: |-
          id(last_command_ms) = millis();
      - if:
          condition:
            lambda: 'return id(battery_ok);'
          then:
            - output.set_level:
                id: left_pwm
                level: !lambda 'return std::min(1.0f, id(drive_duty).state / 100.0f * (1.0f + id(left_trim).state / 100.0f));'
            - output.set_level:
                id: right_pwm
                level: !lambda 'return id(drive_duty).state / 100.0;'
            - output.turn_off: left_forward_pin
            - output.turn_off: right_forward_pin
            - output.turn_on: left_reverse_pin
            - output.turn_on: right_reverse_pin
            - text_sensor.template.publish:
                id: motion_status
                state: "Backward"
          else:
            - script.execute: motor_stop
            - text_sensor.template.publish:
                id: motion_status
                state: "Stopped"
            - logger.log: "Backward blocked (low battery)"
    - action: left
      then:
      - script.stop: motor_stop
      - lambda: |-
          id(last_command_ms) = millis();
      - if:
          condition:
            lambda: 'return id(battery_ok) && !id(cliff_detected);'
          then:
            - output.set_level:
                id: left_pwm
                level: !lambda 'return id(pivot_duty).state / 100.0;'
            - output.set_level:
                id: right_pwm
                level: !lambda 'return id(pivot_duty).state / 100.0;'
            - output.turn_off: left_forward_pin
            - output.turn_on: right_forward_pin
            - output.turn_on: left_reverse_pin
            - output.turn_off: right_reverse_pin
            - text_sensor.template.publish:
                id: motion_status
                state: "Left"
          else:
            - script.execute: motor_stop
            - text_sensor.template.publish:
                id: motion_status
                state: "Stopped"
            - logger.log: "Left blocked (cliff detected or low battery)"
    - action: right
      then:
      - script.stop: motor_stop
      - lambda: |-
          id(last_command_ms) = millis();
      - if:
          condition:
            lambda: 'return id(battery_ok) && !id(cliff_detected);'
          then:
            - output.set_level:
                id: left_pwm
                level: !lambda 'return id(pivot_duty).state / 100.0;'
            - output.set_level:
                id: right_pwm
                level: !lambda 'return id(pivot_duty).state / 100.0;'
            - output.turn_on: left_forward_pin
            - output.turn_off: right_forward_pin
            - output.turn_off: left_reverse_pin
            - output.turn_on: right_reverse_pin
            - text_sensor.template.publish:
                id: motion_status
                state: "Right"
          else:
            - script.execute: motor_stop
            - text_sensor.template.publish:
                id: motion_status
                state: "Stopped"
            - logger.log: "Right blocked (cliff detected or low battery)"
    - action: stop
      then:
      - script.execute: motor_stop
      - text_sensor.template.publish:
          id: motion_status
          state: "Stopped"
