# Builds the rover-brain MCP server image (brain/Dockerfile) and publishes it to
# ghcr.io/moellere/rover. Mirrors moellere/unifi-dns-sync's docker-publish.yml.
# The cluster pins a version tag (vX.Y.Z -> X.Y.Z) in moellere/argocd.
name: brain image

on:
  push:
    branches: ["master"]
    tags: ["v*.*.*"]
    paths: ["brain/**", ".github/workflows/brain-image.yml"]
  pull_request:
    branches: ["master"]
    paths: ["brain/**"]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Log into ${{ env.REGISTRY }}
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=edge,enable={{is_default_branch}}
            type=sha
      - uses: docker/build-push-action@v5
        with:
          context: .
          file: brain/Dockerfile
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
